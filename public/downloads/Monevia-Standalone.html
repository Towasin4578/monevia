<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monevia Offline Standalone App</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0B1B30;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: #142D4E;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .btn {
        display: inline-block;
        background: #3563E9;
        color: white;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 14px;
        font-weight: bold;
        font-size: 16px;
        margin-top: 20px;
        transition: 0.2s;
      }
      .btn:hover {
        background: #2B50C7;
      }
      .pill {
        display: inline-block;
        background: rgba(22, 163, 106, 0.2);
        color: #10B981;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="pill">✓ 100% Offline Ready</div>
      <h1 style="margin: 0 0 10px 0; font-size: 28px;">Monevia</h1>
      <p style="color: #94A3B8; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0;">
        Your Money. Your Control.<br/>
        This standalone package lets you manage multi-currency finances directly on your device.
      </p>
      <a href="https://monevia.vercel.app" class="btn">Launch Live Online Web App</a>
      <p style="color: #64748B; font-size: 12px; margin-top: 24px;">
        Crafted by Towasin • <a href="https://towasin.pages.dev" style="color: #38BDF8;" target="_blank">towasin.pages.dev</a>
      </p>
    </div>
  </body>
</html>
